#
# Successor to x2_tennis_mixed_v2.yaml. Two changes, nothing else:
#   - UPGRADES: tennis_005_ss / tennis_006_ss / tennis_007_ss were mid-training
#     freezes (26000 / 25000 / 22500). Their source runs have since COMPLETED, so
#     they are replaced by final-iteration teachers named tennis_005 / _006 / _007
#     (29999 of 30000 saved), matching how tennis_002 superseded tennis_002_ss.
#     The superseded *_ss directories are left on disk untouched.
#   - NEW MOTIONS: eight teachers existed for motions 000-007; motions 008, 009,
#     010, 011, 013, 014 and 015 are added (motion 012 does not exist). Each is a
#     completed 30k standing-start run, frozen into logs/distillation/teachers/.
#
# robot, base_task, version and sampling_weight are deliberately IDENTICAL to v2,
# so a run from this manifest differs from the 8-teacher v2 runs in teacher count
# and motion coverage only (15 members, one per distinct motion, under the
# exporter's 16-member ceiling).
#
# v2 remains valid and unchanged: the 16384/8192 sharded runs and their cohort
# evaluations pin its manifest_sha256 and artifact digests.
