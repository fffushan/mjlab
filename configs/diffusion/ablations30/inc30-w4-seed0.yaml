# Revision-3 (30-teacher VAE, thirty motions) training input.  Model structure,
# parameter count, noise schedule, EMA, optimizer and dropout are unchanged from
# revision 2; only the contract revision and the ablation treatment differ.
# The trainer fails closed unless `contract:` matches --contract.
# Arm: turnover probe - the measured dose-response was monotone to 2.0.

# Non-authorizing input: the CLI still requires an explicit --epochs/--max-updates
# budget.  Only weight *ratios* matter, because the weighted loss normalizes by
# weighted channel counts, so this arm is the ratio latent:state = 4:1.
schema_version: mjlab-x2-state-latent-train-v1
contract: docs/plans/beyondmimic_diffusion_d1_no_mixtures_inc30_contract.yaml
model: {layers: 6, width: 512, attention_heads: 8, ffn_width: 2048, dropout: 0.0}
noise: {training_k: 1000, cosine_offset: 0.008, beta_min: 1.0e-5, beta_max: 0.999, updates: 20}
training:
  epochs: 400
  effective_batch_size: 512
  microbatch_size: 128
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.001
  scheduler: cosine
  warmup_updates: 10000
  max_grad_norm: 1.0
  mixed_precision: bf16
  loss_reduction: token_mean
  seed: 0
ema: {power: 0.75, max_decay: 0.9999}
sampling: {clean_weight: 1, perturbed_weight: 1}
eval: {split: validation, seed: 0}
ablation:
  latent_loss_weight: 4
  state_loss_weight: 1
  checkpoint_every: 4000
