# Revision-2 ablation arm: logit-normal level sampling (mid-noise emphasis)
# Contract-bound to the 12-teacher VAE revision, identical hyperparameters to
# `x2_50hz_train_inc12.yaml` except for the `ablation` block below.
# Non-authorizing training input; the CLI still needs an explicit budget.
schema_version: mjlab-x2-state-latent-train-v1
contract: docs/plans/beyondmimic_diffusion_d1_no_mixtures_inc12_contract.yaml
model: {layers: 6, width: 512, attention_heads: 8, ffn_width: 2048, dropout: 0.0}
noise: {training_k: 1000, cosine_offset: 0.008, beta_min: 1.0e-5, beta_max: 0.999, updates: 20}
training:
  epochs: 1000
  max_updates: 50000
  effective_batch_size: 512
  microbatch_size: 128
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.001
  scheduler: cosine
  warmup_updates: 10000
  max_grad_norm: 1.0
  mixed_precision: bf16
  loss_reduction: token_mean
  seed: 0
ema: {power: 0.75, max_decay: 0.9999}
sampling: {clean_weight: 1.0, perturbed_weight: 1.0}
eval: {split: validation, seed: 0}
ablation:
  level_sampling: logit_normal
  level_logit_std: 1.0
  checkpoint_every: 4000
